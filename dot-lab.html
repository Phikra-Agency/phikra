<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#272727">
    <meta name="robots" content="noindex">
    <title>Phikra — dot lab</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --phikra-bg: #272727;
            --phikra-text: #e8ddd8;
            --phikra-red: #e50d4a;
            --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
            --font-display: "Syne", system-ui, sans-serif;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font-display);
            background: var(--phikra-bg);
            color: var(--phikra-text);
            padding: clamp(1.25rem, 4vw, 2.5rem);
        }

        a {
            color: rgba(255, 172, 190, 0.9);
        }

        header {
            max-width: 56rem;
            margin: 0 auto 2rem;
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: clamp(1.35rem, 3vw, 1.75rem);
            font-weight: 700;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .nav {
            font-size: 0.85rem;
            color: rgba(232, 221, 216, 0.55);
        }

        .strip {
            max-width: 56rem;
            margin: 0 auto 1.75rem;
            border: 1px solid rgba(232, 221, 216, 0.1);
            background: rgba(18, 18, 18, 0.35);
            padding: 1.1rem 1.1rem 1.25rem;
        }

        .strip h2 {
            margin: 0 0 0.9rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(232, 221, 216, 0.55);
        }

        .frames {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 0.55rem;
        }

        @media (max-width: 640px) {
            .frames {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        .frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.45rem;
        }

        .frame__stage {
            width: 100%;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(ellipse 70% 60% at 50% 55%, rgba(229, 13, 74, 0.1), transparent 70%);
        }

        .frame__label {
            font-size: 0.68rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(232, 221, 216, 0.45);
        }

        @property --wipe {
            syntax: "<percentage>";
            inherits: false;
            initial-value: 0%;
        }

        .dot {
            display: block;
            width: min(4.6rem, 18vw);
            height: auto;
            aspect-ratio: 101 / 116;
            color: var(--phikra-red);
            overflow: visible;
            filter:
                drop-shadow(0 0 8px rgba(255, 130, 170, 0.4)),
                drop-shadow(0 0 16px rgba(229, 13, 74, 0.22));
        }

        .dot__body {
            fill: currentColor;
        }

        .dot__spine {
            fill: none;
            stroke: currentColor;
            stroke-width: 14;
            stroke-linecap: round;
            stroke-linejoin: round;
            stroke-dasharray: 1;
            stroke-dashoffset: 1;
            opacity: 0;
        }

        /* hard edge wipe */
        .dot--hard {
            -webkit-mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 var(--wipe),
                transparent var(--wipe)
            );
            mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 var(--wipe),
                transparent var(--wipe)
            );
        }

        /* soft leading edge */
        .dot--soft {
            -webkit-mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 12%)),
                transparent var(--wipe)
            );
            mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 12%)),
                transparent var(--wipe)
            );
        }

        /* press: origin + slight scale at contact */
        .dot--press {
            transform-origin: 28% 22%;
            -webkit-mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 10%)),
                transparent var(--wipe)
            );
            mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 10%)),
                transparent var(--wipe)
            );
        }

        .dot--press.is-contact {
            transform: scale(0.94);
        }

        .dot--press.is-settle {
            transform: scale(0.97);
        }

        /* spine then flood */
        .dot--spine .dot__body {
            -webkit-mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 10%)),
                transparent var(--wipe)
            );
            mask-image: linear-gradient(
                135deg,
                #000 0%,
                #000 max(0%, calc(var(--wipe) - 10%)),
                transparent var(--wipe)
            );
        }

        .dot--spine[data-spine="0"] .dot__spine {
            stroke-dashoffset: 1;
            opacity: 0;
        }

        .dot--spine[data-spine="0.35"] .dot__spine {
            stroke-dashoffset: 0.65;
            opacity: 0.95;
        }

        .dot--spine[data-spine="0.7"] .dot__spine {
            stroke-dashoffset: 0.3;
            opacity: 1;
        }

        .dot--spine[data-spine="1"] .dot__spine {
            stroke-dashoffset: 0;
            opacity: 1;
        }

        .dot--spine[data-spine="fade"] .dot__spine {
            stroke-dashoffset: 0;
            opacity: 0.3;
        }

        .dot--spine[data-spine="gone"] .dot__spine {
            stroke-dashoffset: 0;
            opacity: 0;
        }

        .live {
            max-width: 56rem;
            margin: 0 auto 1.75rem;
            border: 1px solid rgba(232, 221, 216, 0.1);
            background: rgba(18, 18, 18, 0.35);
            padding: 1.1rem 1.1rem 1.25rem;
        }

        .live h2 {
            margin: 0 0 0.9rem;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(232, 221, 216, 0.55);
        }

        .live__stage {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 12rem;
            background:
                radial-gradient(ellipse 70% 60% at 50% 55%, rgba(229, 13, 74, 0.1), transparent 70%);
        }

        .live .dot {
            width: min(8.5rem, 36vw);
            animation: wipe-hard 2s var(--ease-out) infinite both;
        }

        @keyframes wipe-hard {
            0% {
                --wipe: 0%;
                opacity: 1;
            }
            42%,
            68% {
                --wipe: 100%;
                opacity: 1;
            }
            88%,
            100% {
                --wipe: 100%;
                opacity: 0;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .live .dot {
                animation: none;
                opacity: 0.92;
                -webkit-mask-image: none;
                mask-image: none;
            }
        }
    </style>
</head>
